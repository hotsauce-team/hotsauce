name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-deno:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            .deno_cache
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Run tests
        run: deno task test

  typecheck-node:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Deno (for jsr imports)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies via JSR
        run: deno install

      - name: Type check
        run: deno check packages/*/mod.ts
