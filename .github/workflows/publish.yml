name: Publish to JSR

on:
  push:
    tags:
      - 'v*'

# Require write permissions for JSR provenance attestation
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only publish from main branch
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main branch
        run: |
          # Check if the tagged commit is on main
          if ! git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/main'; then
            echo "❌ Tag must be on main branch"
            echo "   Tagged commit: $GITHUB_SHA"
            echo "   Branches containing this commit:"
            git branch -r --contains "$GITHUB_SHA"
            exit 1
          fi
          echo "✅ Tag is on main branch"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run tests
        run: deno task test

      - name: Update the package versions
        run: |
          deno task update-package-versions --version "${GITHUB_REF_NAME#v}"
      
      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deno.jsonc packages/*/deno.json
          git commit -m "chore: bump version to ${GITHUB_REF_NAME#v}" || echo "No changes to commit"
          git push origin HEAD:main

      # Replace lines in deno.jsonc to use JSR import paths
      # e.g. `./packages/core` -> `jsr:@hotsauce/core@<version>`
      - name: Update import paths for JSR
        run: |
          deno task update-jsr-paths --version "${GITHUB_REF_NAME#v}"

      # Publish packages in dependency order:
      # 1. core (no internal deps)
      # 2. ui (no internal deps)
      # 3. workers (no internal deps)
      # 4. auth (depends on nothing internal)
      # 5. plugins (depends on workers)
      # 6. cms (depends on core, ui, workers, auth, plugins)


      - name: Publish @hotsauce/core
        run: deno publish --allow-dirty
        working-directory: packages/core

      - name: Publish @hotsauce/workers
        run: deno publish --allow-dirty
        working-directory: packages/workers

      - name: Publish @hotsauce/plugins
        run: deno publish --allow-dirty
        working-directory: packages/plugins

      - name: Publish @hotsauce/ui
        run: deno publish --allow-dirty
        working-directory: packages/ui

      - name: Publish @hotsauce/auth
        run: deno publish --allow-dirty
        working-directory: packages/auth

      - name: Publish @hotsauce/cms
        run: deno publish --allow-dirty
        working-directory: packages/cms
