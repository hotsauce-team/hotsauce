name: Agent Implement

# agent:implement — the agent implements the issue on a branch; the workflow
# pushes it, opens a PR, and requests a GitHub Copilot review. Mirrors
# sandcastle's .github/workflows/agent-implement.yml (minus their sub-issue/PRD
# handling and their own review-agent loop — we request Copilot instead).

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-implement-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write # branch push
      issues: write # label transitions + comments
      pull-requests: write # preflight PR search

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      # Refuse if an open PR already closes this issue (avoids duplicate runs).
      - name: Preflight existing PR
        id: preflight
        run: |
          set -euo pipefail
          existing=$(gh pr list --state open \
            --search "in:body \"#${ISSUE_NUMBER}\"" \
            --json number,url,body \
            --jq "[.[] | select(.body | test(\"(?i)(closes|fixes|resolves)\\\\s+#${ISSUE_NUMBER}\\\\b\"))]" \
            || echo '[]')
          if [ "$(echo "$existing" | jq 'length')" != "0" ]; then
            echo "refused=true" >> "$GITHUB_OUTPUT"
            echo "existing_pr_url=$(echo "$existing" | jq -r '.[0].url')" >> "$GITHUB_OUTPUT"
          else
            echo "refused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse existing PR
        if: steps.preflight.outputs.refused == 'true'
        env:
          EXISTING_PR_URL: ${{ steps.preflight.outputs.existing_pr_url }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue comment "$ISSUE_NUMBER" --body "Refused to run: $EXISTING_PR_URL already targets this issue. Close it first, then re-add \`agent:implement\`."

      - name: Transition labels
        if: steps.preflight.outputs.refused != 'true'
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:blocked" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:in-progress"

      - name: Checkout main
        if: steps.preflight.outputs.refused != 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute branch name
        if: steps.preflight.outputs.refused != 'true'
        id: branch
        run: |
          slug=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-50)
          echo "name=agent/issue-${ISSUE_NUMBER}-${slug}" >> "$GITHUB_OUTPUT"

      - name: Create branch
        if: steps.preflight.outputs.refused != 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git config user.name "Hotsauce Agent"
          git config user.email "agent@hotsauce.local"
          git checkout -b "$BRANCH"

      - name: Setup Node.js
        if: steps.preflight.outputs.refused != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Deno
        if: steps.preflight.outputs.refused != 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x # agent runs `deno task test`

      - name: Install workflow dependencies
        if: steps.preflight.outputs.refused != 'true'
        working-directory: .sandcastle
        run: npm install

      - name: Install Claude Code
        if: steps.preflight.outputs.refused != 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Run from the repo root so sandcastle's cwd is the repo; the local tsx
      # binary resolves @ai-hero/sandcastle from .sandcastle.
      - name: Run implementation agent
        if: steps.preflight.outputs.refused != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: ./.sandcastle/node_modules/.bin/tsx .sandcastle/agent-workflows/implement/implement.ts

      # Push with the default GITHUB_TOKEN (contents: write).
      - name: Push branch
        if: steps.preflight.outputs.refused != 'true' && success()
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: git push --force origin "$BRANCH"

      # PR + review use the PAT so test.yml runs on the agent's PR.
      - name: Open PR and request Copilot review
        if: steps.preflight.outputs.refused != 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.PR_CREATE_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          title="Agent: ${ISSUE_TITLE} (#${ISSUE_NUMBER})"
          title="${title:0:256}"
          body_file="${RUNNER_TEMP}/pr-body.md"
          {
            echo "Closes #${ISSUE_NUMBER}"
            echo
            echo "Implemented by the agent-on-issue workflow."
          } > "$body_file"
          pr_url=$(gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$body_file" | tail -n1)
          # Request Copilot now; it reviews asynchronously, concurrently with the
          # Claude reviewer below.
          gh pr edit "$pr_url" --add-reviewer @copilot \
            || echo "::warning::Could not request Copilot review (is Copilot code review enabled?)"
          echo "PR_URL=$pr_url" >> "$GITHUB_ENV"
          echo "PR_NUMBER=$(gh pr view "$pr_url" --json number -q .number)" >> "$GITHUB_ENV"

      # --- Review round: a Claude reviewer + Copilot, then one pass of fixes ---

      # The agent emits structured findings (OUTPUT_DIR/review.json); the workflow
      # posts them. Runs concurrently with the Copilot request above.
      - name: Run Claude review agent
        if: steps.preflight.outputs.refused != 'true' && success()
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: ./.sandcastle/node_modules/.bin/tsx .sandcastle/agent-workflows/review/review.ts

      - name: Post Claude review
        if: steps.preflight.outputs.refused != 'true' && success()
        run: |
          set -euo pipefail
          review_file="${RUNNER_TEMP}/review.json"
          if [ ! -s "$review_file" ]; then
            echo "No review.json produced; skipping."
            exit 0
          fi
          payload="${RUNNER_TEMP}/review-payload.json"
          jq '{event: "COMMENT", body: .summary,
               comments: [.comments[] | {path, line, side, body}]}' \
            "$review_file" > "$payload"
          gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" -X POST --input "$payload" \
            || echo "::warning::Could not post Claude review."

      # Copilot reviews asynchronously; poll (bounded) so the fix agent sees its
      # comments. A timeout is a warning, not a failure.
      - name: Wait for Copilot review
        if: steps.preflight.outputs.refused != 'true' && success()
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 600 )) # ~10 min cap, inside the 60 min budget
          while :; do
            count=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" \
              --jq '[.[] | select(.user.login | test("copilot";"i"))] | length' 2>/dev/null || echo 0)
            if [ "${count:-0}" -gt 0 ]; then
              echo "Copilot review detected."
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::Copilot review did not arrive within the timeout; proceeding with available comments."
              break
            fi
            sleep 20
          done

      # Fix agent: fetch all comments (Copilot + Claude), fix + commit, emit
      # replies (OUTPUT_DIR/replies.json). Exits early if there are no comments.
      - name: Run address-review agent
        if: steps.preflight.outputs.refused != 'true' && success()
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: ./.sandcastle/node_modules/.bin/tsx .sandcastle/agent-workflows/address-review/address-review.ts

      # Deterministic gate so a broken fix lands the issue on agent:blocked
      # rather than relying on the async test.yml run.
      - name: Run tests after fixes
        if: steps.preflight.outputs.refused != 'true' && success()
        run: deno task test

      # Re-push fix commits with the PAT so test.yml re-runs on the PR.
      - name: Re-push review fixes
        if: steps.preflight.outputs.refused != 'true' && success()
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          PR_CREATE_TOKEN: ${{ secrets.PR_CREATE_TOKEN }}
        run: |
          set -euo pipefail
          ahead=$(git rev-list --count "origin/${BRANCH}..${BRANCH}")
          if [ "$ahead" -eq 0 ]; then
            echo "No new commits from the review round; nothing to re-push."
            exit 0
          fi
          git remote set-url origin "https://x-access-token:${PR_CREATE_TOKEN}@github.com/${GH_REPO}.git"
          git push origin "$BRANCH"

      - name: Post review replies
        if: steps.preflight.outputs.refused != 'true' && success()
        run: |
          set -euo pipefail
          replies_file="${RUNNER_TEMP}/replies.json"
          if [ ! -s "$replies_file" ]; then
            echo "No replies to post."
            exit 0
          fi
          count=$(jq 'length' "$replies_file")
          if [ "$count" -eq 0 ]; then
            echo "No replies to post."
            exit 0
          fi
          for i in $(seq 0 $(( count - 1 ))); do
            cid=$(jq -r ".[$i].comment_id" "$replies_file")
            body=$(jq -r ".[$i].body" "$replies_file")
            gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/comments" \
              -X POST -f body="$body" -F in_reply_to="$cid" \
              || echo "::warning::Could not post reply to comment $cid."
          done

      - name: Finalize implement
        if: steps.preflight.outputs.refused != 'true' && success()
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:done"
          gh issue comment "$ISSUE_NUMBER" --body "Opened PR: $PR_URL"

      - name: Mark blocked on failure
        if: steps.preflight.outputs.refused != 'true' && failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written; check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '`agent:implement` run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\nRe-add `agent:implement` to retry.\n' "$reason" "$RUN_URL" > "$body_file"
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body-file "$body_file"

      - name: Always remove in-progress
        if: always() && steps.preflight.outputs.refused != 'true'
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:in-progress" || true
