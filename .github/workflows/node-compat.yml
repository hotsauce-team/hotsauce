name: Node.js Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build npm packages
        run: |
          deno run --no-lock \
            --ignore-env \
            --allow-env="DENO_DIR,HOME" \
            --allow-read=".,/home/runner/.npmrc,/home/runner/.cache/deno" \
            --allow-write=".,/home/runner/.cache/deno" \
            --allow-net="jsr.io,registry.npmjs.org" \
            scripts/npm/build_npm.ts

      - name: Copy packages to npm-tests workspace
        run: |
          mkdir -p npm-tests/packages
          cp -r npm/core npm-tests/packages/
          cp -r npm/ui npm-tests/packages/
          cp -r npm/auth npm-tests/packages/
          cp -r npm/cms npm-tests/packages/

      - name: Install test dependencies
        working-directory: npm-tests
        run: npm install

      - name: Run tests
        working-directory: npm-tests
        run: npm test
