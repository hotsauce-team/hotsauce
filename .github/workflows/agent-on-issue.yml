name: Agent on Issue

# Label-driven state machine on issues, powered by sandcastle (@ai-hero/sandcastle)
# running Claude Code. Mirrors sandcastle's own agent-workflows layout:
#   agent:explore   -> read-only research, posts triage notes  (explore/)
#   agent:implement -> implement on a branch, open a PR, request Copilot (implement/)
# Status labels: agent:in-progress, agent:explored, agent:done, agent:blocked.
#
# Sandbox model follows the examples: no-sandbox (the ephemeral runner IS the
# sandbox). The agent commits on a branch the workflow pre-creates; the workflow
# (not the agent) pushes, opens the PR, requests review, and edits labels.

on:
  issues:
    types: [labeled]

permissions:
  contents: write # branch push
  issues: write # label transitions + comments

concurrency:
  group: agent-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  agent:
    if: github.event.label.name == 'agent:explore' || github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      # 'agent:explore' -> explore, 'agent:implement' -> implement
      MODE: ${{ github.event.label.name == 'agent:explore' && 'explore' || 'implement' }}
      BRANCH: agent/issue-${{ github.event.issue.number }}
      OUTPUT_DIR: ${{ github.workspace }}/.sandcastle/output
      GH_TOKEN: ${{ github.token }} # gh issue view (in scripts), labels, comments
    defaults:
      run:
        working-directory: .sandcastle
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the agent branch is clean

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # runs the sandcastle workflow scripts (tsx)

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x # agent runs `deno task test` on the runner

      - name: Install Claude Code CLI
        working-directory: ${{ github.workspace }}
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install workflow dependencies
        run: npm install

      - name: Mark in-progress
        working-directory: ${{ github.workspace }}
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --remove-label "${{ github.event.label.name }}" \
            --add-label "agent:in-progress"

      # ── explore ──────────────────────────────────────────────────────────
      - name: Explore
        if: env.MODE == 'explore'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: npx tsx agent-workflows/explore/explore.ts

      - name: Post triage notes
        if: success() && env.MODE == 'explore'
        working-directory: ${{ github.workspace }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file "$OUTPUT_DIR/comment.md"
          gh issue edit "$ISSUE_NUMBER" \
            --remove-label agent:in-progress --add-label agent:explored

      # ── implement ────────────────────────────────────────────────────────
      - name: Create agent branch
        if: env.MODE == 'implement'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.email "agent@hotsauce.local"
          git config user.name "Hotsauce Agent"
          git switch -c "$BRANCH"

      - name: Implement
        if: env.MODE == 'implement'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: npx tsx agent-workflows/implement/implement.ts

      - name: Push, open PR, request Copilot review
        if: success() && env.MODE == 'implement'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.PR_CREATE_TOKEN }} # PAT -> triggers test.yml on the PR
        run: |
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "Agent: $ISSUE_TITLE (#$ISSUE_NUMBER)" \
            --body "Automated work for #$ISSUE_NUMBER. Closes #$ISSUE_NUMBER.")
          gh pr edit "$PR_URL" --add-reviewer @copilot \
            || echo "::warning::Could not request Copilot review (is Copilot code review enabled?)"
          echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"

      - name: Finalize implement
        if: success() && env.MODE == 'implement'
        working-directory: ${{ github.workspace }}
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --remove-label agent:in-progress --add-label agent:done
          gh issue comment "$ISSUE_NUMBER" --body "Opened PR: $PR_URL"

      # ── failure path (both modes) ────────────────────────────────────────
      - name: Mark blocked
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --remove-label agent:in-progress --add-label agent:blocked || true
          gh issue comment "$ISSUE_NUMBER" \
            --body "Agent run failed in **$MODE** mode. See workflow logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
