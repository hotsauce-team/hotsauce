# S3 storage override - adds MinIO for local S3-compatible storage testing
# Usage: docker compose -f docker-compose.yml -f docker-compose.s3.yml up
#
# MinIO console: http://localhost:9001 (minioadmin/minioadmin)
# The 'uploads' bucket is created automatically on startup.

services:
  demo:
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=http://localhost:9000
      - S3_BUCKET=uploads
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Enable CORS for browser uploads
      MINIO_API_CORS_ALLOW_ORIGIN: 'http://localhost:3000'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  # Create the uploads bucket on startup
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/uploads;
      exit 0;
      "

volumes:
  minio-data:
